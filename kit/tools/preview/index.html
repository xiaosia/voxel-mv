<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MV 预览</title>
<style>
:root{--bg:#14151a;--panel:#1d1f26;--line:#2c2f39;--text:#e6e7ea;--dim:#9096a3;--acc:#7aa2ff;--bad:#ff6b6b;--warn:#f0b94a;--ok:#5ccf8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Microsoft YaHei",sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr auto;height:100vh}
#view{position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:1920px;height:1080px;transform-origin:center center;flex:none}
#wrap iframe{width:1920px;height:1080px;border:0;display:block;background:#000}
#hud{position:absolute;left:10px;top:8px;font:12px/1.4 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px;pointer-events:none;white-space:pre}
#err{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(120,20,20,.92);color:#fff;padding:8px 10px;border-radius:6px;font:12px/1.4 ui-monospace,Consolas,monospace;display:none;max-height:40%;overflow:auto;white-space:pre-wrap}
#busy{position:absolute;right:10px;top:8px;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:6px;display:none}
#side{grid-row:1/3;grid-column:2;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px}
#side h3{margin:12px 0 6px;font-size:13px;color:var(--dim);font-weight:600}
#side h3:first-child{margin-top:0}
.rule{border-left:3px solid var(--bad);padding:4px 8px;margin:6px 0;background:#23252d;border-radius:0 4px 4px 0}
.rule.warn{border-color:var(--warn)}
.rule b{font-weight:600}
.rule .d{color:var(--dim);word-break:break-all}
.rule a,.jump{color:var(--acc);cursor:pointer;text-decoration:none}
.okline{color:var(--ok)}
#chars div{font:12px/1.5 ui-monospace,Consolas,monospace}
#bar{grid-column:1;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px 8px}
#ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
button,select{background:#2a2d37;color:var(--text);border:1px solid #3a3e4a;border-radius:5px;padding:3px 9px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:#334a7a;border-color:var(--acc)}
#time{font:13px ui-monospace,Consolas,monospace;min-width:280px}
#tl{width:100%;height:96px;display:block;cursor:pointer;border-radius:4px}
.sp{flex:1}
#stat{color:var(--dim);font-size:12px}
@media (max-width:900px){#app{grid-template-columns:1fr}#side{grid-column:1;grid-row:auto;max-height:35vh}}
</style></head>
<body>
<div id="app">
  <div id="view">
    <div id="wrap"><iframe id="fr" allow="autoplay"></iframe></div>
    <div id="hud"></div><div id="busy">刷新中…</div><div id="err"></div>
  </div>
  <div id="bar">
    <div id="ctl">
      <button id="play" title="空格">▶ 播放</button>
      <button id="prevb" title="Shift+←">−1 拍</button><button id="prevf" title="←">−1 帧</button>
      <button id="nextf" title="→">+1 帧</button><button id="nextb" title="Shift+→">+1 拍</button>
      <select id="rate" title="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select>
      <button id="la" title="[">循环起</button><button id="lb" title="]">循环止</button><button id="loop" title="L">循环</button>
      <button id="probe" title="P：暂停时读这一帧的体素探针">探针</button>
      <span id="time"></span><span class="sp"></span><span id="stat"></span>
    </div>
    <canvas id="tl"></canvas>
  </div>
  <div id="side">
    <h3>这一帧</h3><div id="chars" class="d">暂停时显示角色、镜头和体素探针</div>
    <h3>检查结果 <span id="chkt" style="font-weight:400"></span></h3><div id="checks">还没有检查结果（跑 python tools/run.py check 后自动出现在这里）</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id), fr = $('fr'), FPS = 24;
let W = null, PLAN = null, LYR = [], DUR = 0, START = 0, END = 0, BEAT0 = 0, SPB = 0.5;
let audio = new Audio('/data/song.wav'); audio.preload = 'auto'; audio.preservesPitch = true;
let tCur = 0, lastF = -1, loopA = null, loopB = null, looping = false, ready = false, wantProbe = true;
let stamp = null, chkStamp = null, fpsN = 0, fpsT = performance.now(), fpsShow = 0, slow = 0;
const issues = [];   // 时间轴上的红点 [本片帧号起, 止, 规则]

// ---------- 页面加载 / 自动刷新 ----------
function load() {
  ready = false; $('busy').style.display = 'block';
  fr.src = '/index.html?export=1&preview=1&r=' + Date.now();
}
fr.addEventListener('load', () => {
  const w = fr.contentWindow, t0 = performance.now();
  const wait = () => {
    if (w.READY === true) return boot(w);
    if (performance.now() - t0 > 60000) { showErr('页面 60 秒还没准备好（window.READY 没变 true）：看下面的报错，或者按 F12 打开控制台'); $('busy').style.display = 'none'; return; }
    setTimeout(wait, 100);
  };
  wait();
});
function boot(w) {
  W = w; PLAN = w.PLAN; DUR = w.DUR; START = PLAN.start; END = PLAN.end;
  BEAT0 = (PLAN.tempo || {}).beat0 ?? 0; SPB = (PLAN.tempo || {}).spb ?? 0.5;
  fetch('/assets/lyrics.json').then(r => r.json()).then(j => { LYR = j; drawTL(); }).catch(() => {});
  ready = true; lastF = -1; $('busy').style.display = 'none'; hideErr();
  tCur = Math.min(tCur, DUR - 1 / FPS); draw(true); drawTL();
  $('stat').textContent = '已载入 ' + new Date().toLocaleTimeString();
}
window.addEventListener('message', e => { if (e.data && e.data.voxelPreviewError) showErr(e.data.voxelPreviewError); });
function showErr(m) { const el = $('err'); el.textContent = (el.textContent ? el.textContent + '\n' : '') + m; el.textContent = el.textContent.split('\n').slice(-8).join('\n'); el.style.display = 'block'; }
function hideErr() { $('err').style.display = 'none'; $('err').textContent = ''; }
async function poll() {
  try {
    const s = await (await fetch('/__preview/stamp')).json();
    if (stamp !== null && s.page !== stamp) { $('stat').textContent = '文件改了，刷新…'; load(); }
    if (s.checks !== chkStamp) loadChecks();
    stamp = s.page; chkStamp = s.checks;
  } catch (e) { $('stat').textContent = '预览服务连不上了（run.py preview 停了？）'; }
  setTimeout(poll, 800);
}

// ---------- 播放 ----------
const playing = () => !audio.paused;
function setT(t) { tCur = Math.max(0, Math.min(DUR - 1 / FPS, t)); if (playing() || audio.readyState) { try { audio.currentTime = tCur; } catch (e) {} } draw(true); }
function toggle() {
  if (!ready) return;
  if (playing()) { audio.pause(); draw(true); }
  else { try { audio.currentTime = tCur; } catch (e) {} audio.play().catch(err => showErr('放不了音乐：' + err.message + '（data/song.wav 在吗？）')); }
}
function frameOf(t) { return Math.min(END - START - 1, Math.round(t * FPS)); }
function draw(force) {
  if (!ready) return;
  const lf = frameOf(tCur);
  if (lf === lastF && !force) return;
  const a = performance.now();
  try { W.render(lf / FPS); } catch (e) { showErr('render 出错：' + (e.stack || e)); }
  const dt = performance.now() - a; slow = slow * 0.9 + dt * 0.1;
  lastF = lf; fpsN++;
  if (!playing() && wantProbe) readProbe();
  hud();
}
function loop() {
  if (ready && playing()) {
    tCur = audio.currentTime;
    if (looping && loopA !== null && loopB !== null && tCur >= loopB) { audio.currentTime = tCur = loopA; }
    if (tCur >= DUR - 1 / FPS) { audio.pause(); tCur = DUR - 1 / FPS; }
    draw(false);
  }
  const now = performance.now();
  if (now - fpsT > 1000) { fpsShow = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
  $('play').textContent = playing() ? '❚❚ 暂停' : '▶ 播放';
  drawTL();
  requestAnimationFrame(loop);
}
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + s.toFixed(2).padStart(5, '0'); };
function hud() {
  const lf = frameOf(tCur), g = START + lf;
  const sc = (PLAN.scenes || []).find(s => g >= s.f0 && g < s.f1), sh = (PLAN.shots || []).find(s => g >= s.f0 && g <= s.f1);
  const cut = (PLAN.cuts || []).find(k => g >= k.c - k.len / 2 && g < k.c + k.len / 2);
  const beat = (g / FPS - BEAT0) / SPB, ly = LYR.find(l => g / FPS >= l.t0 && g / FPS < l.t1);
  $('time').textContent = `${fmt(tCur)} / ${fmt(DUR)}   帧 ${lf}${START ? '（全曲 ' + g + '）' : ''}   第 ${Math.floor(beat / 4) + 1} 小节 ${Math.floor(((beat % 4) + 4) % 4) + 1} 拍`;
  $('hud').textContent = `场景 ${sc ? sc.id : '-'}  镜头 ${sh ? sh.id : '-'}${cut ? '  转场 ' + cut.mode + ' ' + (cut.from || '') + '→' + (cut.to || '') : ''}\n` +
    (sh && sh.note ? sh.note + '\n' : '') + (ly ? '「' + ly.text + '」\n' : '') +
    `${playing() ? fpsShow.toFixed(0) + ' fps，' : ''}每帧 ${slow.toFixed(0)} ms${slow > 41 && playing() ? '（比实时慢，会跳帧，音乐不受影响）' : ''}`;
}
function readProbe() {
  if (!W || !W.voxelProbe) { $('chars').textContent = '页面没有 window.voxelProbe（老引擎？）'; return; }
  let v; try { v = W.voxelProbe(tCur); W.render(tCur); } catch (e) { $('chars').textContent = '探针出错：' + e.message; return; }
  const list = v.chars || [], stuck = Object.fromEntries((v.stuck || []).map(s => [s.who, s.reason + (s.by ? '（' + s.by + '）' : '')]));
  $('chars').innerHTML = `<div>镜头 ${v.shot}${v.cut ? '（转场中）' : ''}，全曲帧 ${v.f}</div>` + (list.length ? list.map(c =>
    `<div>${c.id.padEnd(9)} ${c.act}#${c.i}${c.bad ? ' <span style="color:var(--bad)">坏帧</span>' : ''}` +
    `${c.gap != null && Math.abs(c.gap) > 0.03 ? ` <span style="color:var(--warn)">离地 ${c.gap.toFixed(2)}</span>` : ''}` +
    `${c.noGround ? ' <span style="color:var(--bad)">脚下没地面</span>' : ''}${c.blocked ? ` <span style="color:var(--warn)">鞋底被挡 ${c.blocked}/${c.tested}</span>` : ''}` +
    `${stuck[c.id] ? ' <span style="color:var(--bad)">STUCK ' + stuck[c.id] + '</span>' : ''}</div>`).join('') : '<div>画面里没有角色</div>');
}

// ---------- 检查结果 ----------
async function loadChecks() {
  let j; try { j = await (await fetch('/__preview/checks')).json(); } catch (e) { return; }
  issues.length = 0;
  const box = $('checks'), names = Object.keys(j);
  if (!names.length) return;
  let html = '', bad = 0, newest = 0;
  for (const n of names) {
    newest = Math.max(newest, j[n].mtime);
    for (const r of (j[n].data.rules || [])) {
      if (r.ok) continue;
      bad++;
      const warn = r.tier === 'warn';
      const d = String(r.detail || '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))
        .replace(/(\d{1,6})\s*[–-]\s*(\d{1,6})(?![\d.]*\s*(?:秒|s\b|%|拍|小节|帧\/))|((?:帧号?|f)\s*)(\d{1,6})/g, (m, a, b, pre, one) => {   // 只认「起–止」和「帧 123 / f123」
          const A = +(a ?? one), B = +(b ?? one); if (B < A) return m;
          const loc = x => (START > 0 && x >= START ? x - START : x), la = loc(A), lb = loc(B);
          if (lb > END - START) return m;
          issues.push([la, lb, r.rule, warn]);
          return (pre || '') + `<a data-f="${la}">${a !== undefined ? m : one}</a>`;
        });
      html += `<div class="rule${warn ? ' warn' : ''}"><b>${n} · ${r.rule} ${r.name || ''}</b>${warn ? '（警告）' : ''}<div class="d">${d}</div></div>`;
    }
  }
  box.innerHTML = bad ? html : '<div class="okline">全部通过</div>';
  $('chkt').textContent = '（' + new Date(newest * 1000).toLocaleTimeString() + ' 的结果' + (stamp && newest < stamp ? '，文件改过了，可能过时' : '') + '）';
  box.querySelectorAll('a[data-f]').forEach(a => a.onclick = () => { audio.pause(); setT(+a.dataset.f / FPS); });
  drawTL();
}

// ---------- 时间轴 ----------
const tl = $('tl');
function drawTL() {
  if (!PLAN) return;
  const dpr = devicePixelRatio || 1, w = tl.clientWidth, h = tl.clientHeight;
  if (tl.width !== w * dpr || tl.height !== h * dpr) { tl.width = w * dpr; tl.height = h * dpr; }
  const c = tl.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  c.fillStyle = '#15161b'; c.fillRect(0, 0, w, h);
  const N = END - START, X = f => (f - START) / N * w, XL = lf => lf / N * w;
  const row = (y, hh, items, col, label) => items.forEach((s, i) => {
    const x0 = X(s.f0), x1 = X(s.f1 + (label === 'shot' ? 1 : 0));
    c.fillStyle = col[i % col.length]; c.fillRect(x0, y, Math.max(1, x1 - x0 - 1), hh);
    c.fillStyle = '#e6e7ea'; c.font = '11px system-ui'; if (x1 - x0 > 22) c.fillText(s.id, x0 + 3, y + hh - 4);
  });
  row(2, 18, PLAN.scenes || [], ['#3b4a6b', '#4a3b6b'], 'scene');
  row(22, 18, PLAN.shots || [], ['#2f5a55', '#2f4a5a'], 'shot');
  c.fillStyle = '#ffd36b';
  for (const k of PLAN.cuts || []) { const x0 = X(k.c - k.len / 2), x1 = X(k.c + k.len / 2); c.fillRect(x0, 22, Math.max(2, x1 - x0), 18); }
  c.fillStyle = '#5a5f6e'; c.font = '11px system-ui';
  for (const l of LYR) {
    const x0 = X(l.t0 * FPS), x1 = X(l.t1 * FPS);
    if (x1 < 0 || x0 > w) continue;
    c.fillStyle = '#30333d'; c.fillRect(x0, 44, Math.max(1, x1 - x0 - 1), 16);
    c.fillStyle = '#b8bcc6'; c.save(); c.beginPath(); c.rect(x0, 44, x1 - x0 - 2, 16); c.clip(); c.fillText(l.text, x0 + 2, 56); c.restore();
  }
  // 小节线
  c.fillStyle = '#2a2d36';
  for (let b = Math.ceil((START / FPS - BEAT0) / SPB / 4) * 4; ; b += 4) { const f = (BEAT0 + b * SPB) * FPS; if (f > END) break; c.fillRect(X(f), 62, 1, 12); }
  for (const [a, b, , warn] of issues) { c.fillStyle = warn ? 'rgba(240,185,74,.8)' : 'rgba(255,107,107,.9)'; c.fillRect(XL(a), 76, Math.max(2, XL(b + 1) - XL(a)), 8); }
  if (loopA !== null) { c.fillStyle = looping ? 'rgba(122,162,255,.18)' : 'rgba(122,162,255,.07)'; const a = XL(loopA * FPS), b = loopB !== null ? XL(loopB * FPS) : w; c.fillRect(a, 0, b - a, h); }
  const px = XL(tCur * FPS); c.fillStyle = '#fff'; c.fillRect(px - 1, 0, 2, h);
}
let dragging = false;
const seekEv = e => { const r = tl.getBoundingClientRect(); setT((e.clientX - r.left) / r.width * DUR); };
tl.addEventListener('pointerdown', e => { if (!ready) return; dragging = true; tl.setPointerCapture(e.pointerId); seekEv(e); });
tl.addEventListener('pointermove', e => { if (dragging) seekEv(e); });
tl.addEventListener('pointerup', () => { dragging = false; });

// ---------- 按钮、快捷键 ----------
const step = d => { audio.pause(); setT((frameOf(tCur) + d) / FPS); };
const beatStep = d => { audio.pause(); const g = START / FPS + tCur, b = Math.round((g - BEAT0) / SPB) + d; setT(BEAT0 + b * SPB - START / FPS); };
$('play').onclick = toggle; $('prevf').onclick = () => step(-1); $('nextf').onclick = () => step(1);
$('prevb').onclick = () => beatStep(-1); $('nextb').onclick = () => beatStep(1);
$('rate').onchange = e => { audio.playbackRate = +e.target.value; };
$('la').onclick = () => { loopA = tCur; if (loopB !== null && loopB <= loopA) loopB = null; drawTL(); };
$('lb').onclick = () => { loopB = tCur; if (loopA === null || loopA >= loopB) loopA = 0; looping = true; $('loop').classList.add('on'); drawTL(); };
$('loop').onclick = () => { looping = !looping; $('loop').classList.toggle('on', looping); drawTL(); };
$('probe').onclick = () => { wantProbe = !wantProbe; $('probe').classList.toggle('on', wantProbe); if (wantProbe && !playing()) readProbe(); };
$('probe').classList.add('on');
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? beatStep(-1) : step(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? beatStep(1) : step(1); }
  else if (k === '[') $('la').click(); else if (k === ']') $('lb').click();
  else if (k === 'l' || k === 'L') $('loop').click(); else if (k === 'p' || k === 'P') $('probe').click();
});
function fit() { const v = $('view'), s = Math.min(v.clientWidth / 1920, v.clientHeight / 1080); $('wrap').style.transform = `scale(${s})`; $('wrap').style.margin = `${(1080 * s - 1080) / 2}px ${(1920 * s - 1920) / 2}px`; drawTL(); }
addEventListener('resize', fit); fit();
load(); poll(); loop();
</script>
</body></html>
